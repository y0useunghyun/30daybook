<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>30 DAYS</title>
<style>
  html, body { margin: 0; background: #fff; }
  /* 배경: 원본 묶음(세로로 세운 누끼)을 화면 안에서 최대 크기로 */
  .page {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    touch-action: none; cursor: grab;
  }
  .page.dragging { cursor: grabbing; }
  .page > img { display: block; max-width: 92vw; max-height: 92vh; user-select: none; -webkit-user-drag: none; }

  /* 단어 링크: 로고처럼 마커로 그린 동그라미. 위치는 사진 기준 % */
  .mark { position: absolute; display: block; transform: rotate(12deg); /* 사진 속 글줄 기울기 */ }
  .mark svg { width: 100%; height: 100%; overflow: visible; }
  .mark path {
    fill: none; stroke: #000; stroke-width: 2.5;
    stroke-linecap: round; stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
    stroke-dasharray: 1; stroke-dashoffset: 0;
  }
  /* 올리면 동그라미를 다시 그림 */
  .mark:hover path, .mark:focus-visible path { animation: redraw .5s ease-out; }
  @keyframes redraw { from { stroke-dashoffset: 1; } }
  .mark:focus-visible { outline: none; }
  @media (prefers-reduced-motion: reduce) { .mark path { animation: none !important; } }
  /* 30일치 지면: 주소가 #result일 때 배경 위, 화면 가운데 1/3 띠에 한 줄로. 윗선 맞춤, 옆으로 넘겨 봄 */
  .sheets {
    /* 한 화면에 4장 반. 폰처럼 좁으면 최소 240px */
    --per-screen: 4.5;
    --sheet-w: max(calc((100vw - 24px) / var(--per-screen) - 24px), 240px);
    display: none; position: fixed; left: 0; right: 0; top: 33.333vh; z-index: 8;
    overflow-x: auto; overflow-y: hidden; overscroll-behavior: contain;
    padding: 0 24px; gap: 24px; align-items: flex-start;
    scrollbar-width: none;
  }
  .sheets::-webkit-scrollbar { display: none; }
  .sheets:target { display: flex; cursor: grab; }
  .sheets.dragging { cursor: grabbing; }
  .sheets .sheet { cursor: inherit; }
  .sheets img { user-select: none; -webkit-user-drag: none; }
  .sheets:focus { outline: none; } /* #result 이동 때 생기는 포커스 테두리 */

  /* 결과물·복잡이 열리면 검은 막으로 배경을 죽임 (애니메이션 없이). 종이들은 그 위에 뜸 */
  .dim {
    display: none; position: fixed; inset: 0; z-index: 7; pointer-events: none;
    background: rgba(0, 0, 0, .2);
  }
  body:has(.sheets:target, .mess:target) .dim { display: block; }

  /* 복잡: 앞뒤 60장이 화면에 우수수. 빈 곳은 클릭이 배경으로 통과(→ 닫힘) */
  .mess {
    --paper-w: clamp(120px, 12vw, 200px);
    display: none; position: fixed; inset: 0; z-index: 8; overflow: hidden; pointer-events: none;
  }
  .mess:target { display: block; }
  .mess:focus { outline: none; }
  .paper {
    position: absolute; left: 0; top: 0; width: calc(var(--w) * var(--paper-w)); height: auto;
    pointer-events: auto; cursor: grab; touch-action: none;
    user-select: none; -webkit-user-drag: none;
  }
  .paper.dragging { cursor: grabbing; }

  .sheet {
    position: relative; flex: none; padding: 0; border: 0; background: none; cursor: pointer;
    transform-style: preserve-3d; transition: transform .6s ease;
  }
  .sheet.flipped { transform: rotateY(180deg); }
  /* 너비 = 원본 스캔 너비 비율 × 기준 너비 → 종이 실제 크기 차이 유지 */
  .sheet img { display: block; width: calc(var(--w) * var(--sheet-w)); height: auto; backface-visibility: hidden; }
  .sheet .back { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; transform: rotateY(180deg); }
  @media (prefers-reduced-motion: reduce) { .sheet { transition: none; } }

  /* 크게 보기: 띠에서 누른 지면을 가운데 크게. 지면 누르면 뒷면, 바깥 누르면 닫힘 */
  .zoom {
    position: fixed; inset: 0; z-index: 9;
    display: grid; place-items: center;
    background: rgba(255, 255, 255, .9);
  }
  .zoom[hidden] { display: none; }
  .zoom .sheet img { width: auto; max-width: 70vw; max-height: 70vh; }
  .zoom .sheet .back { width: 100%; height: 100%; max-width: none; max-height: none; }
  .zoom .sheet:focus { outline: none; } /* 열 때 지면에 주는 포커스 테두리 숨김 (화면에 지면 하나뿐) */
  /* 복잡에서 연 크게 보기: 누른 면 한 장만, 다시 누르면 닫힘 */
  .zoom[data-mode="single"] .back { display: none; }

  /* logo.png는 842×596 캔버스 가운데에 그림이 있어서, 그림 부분만 잘라 보여줌 */
  .logo {
    position: fixed; top: 24px; left: 24px;
    width: 128px; height: 136px; overflow: hidden;
    mix-blend-mode: multiply; z-index: 9; /* 흰 배경 PNG라 사진 위에서 흰 네모 안 보이게. 지면 목록 위에도 떠서 홈 버튼 역할 */
  }
  .logo img {
    width: 421px; /* 원본의 50% */
    margin: -72px 0 0 -138px;
  }

  /* 캐릭터: 마우스를 늦게 따라옴. 평소 c2(웃음), 5초간 안 움직이면 c1(화남) */
  .buddy {
    position: fixed; top: 0; left: 0; z-index: 10;
    width: 100px; height: 90px; overflow: hidden;
    pointer-events: none; mix-blend-mode: multiply; /* PNG가 흰 배경이라 겹칠 때 흰 박스 안 보이게 */
    visibility: hidden;
  }
  .buddy img { width: 337px; /* 원본의 40% */ display: none; }
  /* c1·c2는 캔버스 안 그림 위치가 달라서 각각 맞춤 */
  .buddy .c1 { margin: -82px 0 0 -134px; }
  .buddy .c2 { margin: -67px 0 0 -124px; }
  .buddy .c2, .buddy.angry .c1 { display: block; }
  .buddy.angry .c2 { display: none; }
  @media not (pointer: fine) { .buddy { display: none; } }
</style>
</head>
<body>
  <main class="page">
    <img src="main/main_02.png" alt="클립으로 묶은 원문 지면과 사견 묶음">
    <a class="mark" href="#result" aria-label="결과물 — 30일치 지면 보기" style="left:57.4%; top:32.3%; width:5.7%; height:4.2%"></a>
    <a class="mark" href="#mess" aria-label="복잡 — 모든 종이 쏟기" style="left:67.8%; top:32.3%; width:4.6%; height:3.4%"></a>
  </main>
  <div class="dim"></div>
  <!-- 복잡: 앞뒤 60장을 흩뿌림. 집어서 옮기기, 누르면 크게 -->
  <section id="mess" class="mess" aria-label="모든 종이"></section>
  <!-- 결과물: 30일치 앞면. 누르면 뒷면. 뒤로가기·Esc·로고로 닫힘 -->
  <section id="result" class="sheets" aria-label="30일치 지면"></section>
  <div class="zoom" hidden role="dialog" aria-label="지면 크게 보기">
    <button class="sheet" type="button" aria-label="누르면 뒷면">
      <img class="front" alt=""><img class="back" alt="">
    </button>
  </div>
  <a class="logo" href="./"><img src="logo.png" alt="30 DAYS"></a>
  <div class="buddy" aria-hidden="true">
    <img class="c1" src="c1.png" alt="">
    <img class="c2" src="c2.png" alt="">
  </div>

<script>
  // 손그림 동그라미 (끝이 살짝 겹치게 한 붓질)
  const LOOP = '<svg viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="M10 24 C6 10 38 2 68 4 C90 6 99 18 90 29 C79 40 32 41 13 34 C2 29 5 14 24 8"/></svg>';
  document.querySelectorAll('.mark').forEach(a => a.insertAdjacentHTML('beforeend', LOOP));

  // 결과물: 앞면 30장 (pages/front·back/day01~30.jpg)
  // 원본 스캔 크기 [w, h] — 웹용은 줄여서 실제 크기 비율이 없어 여기서 씀
  const SCAN = [[1627,1548],[1639,1764],[1656,1924],[1650,1548],[1629,1228],[1691,1316],[1704,1796],[1653,1688],[1639,1556],[1623,1168],[1602,1152],[1653,1616],[1629,1404],[1616,1412],[1619,1124],[1616,1408],[1619,1332],[1616,1264],[1639,1496],[1639,1288],[1626,1140],[1632,1496],[1646,1388],[1619,940],[1639,980],[1605,1372],[1612,1636],[1616,1608],[1670,680],[1707,1072]];
  const DAYS = SCAN.length;
  const SCAN_MAX_W = Math.max(...SCAN.map(([w]) => w));
  const pad = n => String(n).padStart(2, '0');
  const sheets = document.getElementById('result');
  // 끊김 없이 돌도록 30장을 한 벌 더 붙임 (복제본은 스크린리더에서 숨김)
  sheets.innerHTML = [...SCAN, ...SCAN].map(([w, h], j) => {
    const i = j % DAYS, d = pad(i + 1), copy = j >= DAYS;
    return `<button class="sheet" type="button" aria-label="${i + 1}일차 지면 (누르면 뒷면)"${copy ? ' aria-hidden="true" tabindex="-1"' : ''}>
      <img src="pages/front/day${d}.jpg" alt="" loading="lazy" width="${w}" height="${h}" style="--w:${w / SCAN_MAX_W}">
      <img class="back" src="pages/back/day${d}.jpg" alt="" loading="lazy">
    </button>`;
  }).join('');
  // 띠에서 누르면 크게 보기
  const zoom = document.querySelector('.zoom');
  const zoomSheet = zoom.querySelector('.sheet');
  let bandDragged = false; // 띠를 끌어 민 직후의 click은 크게 보기로 안 침
  sheets.addEventListener('click', e => {
    if (bandDragged) { bandDragged = false; return; }
    const s = e.target.closest('.sheet');
    if (!s) return;
    const [front, back] = s.querySelectorAll('img');
    openZoom('flip', front.src, back.src, `${s.getAttribute('aria-label').split(' ')[0]} 지면, 누르면 뒷면`);
  });
  // mode 'flip': 누르면 뒷면 (결과물) / 'single': 누르면 닫힘 (복잡)
  function openZoom(mode, frontSrc, backSrc, label) {
    zoom.dataset.mode = mode;
    zoom.querySelector('.front').src = frontSrc;
    zoom.querySelector('.back').src = backSrc || '';
    zoomSheet.classList.remove('flipped');
    zoomSheet.setAttribute('aria-label', label);
    zoom.hidden = false;
    zoomSheet.focus();
  }
  zoom.addEventListener('click', e => {
    if (e.target.closest('.sheet') && zoom.dataset.mode === 'flip') zoomSheet.classList.toggle('flipped');
    else zoom.hidden = true;
  });
  // 결과물·복잡이 열린 상태에서 바깥(배경)을 누르면 닫힘. 배경을 끌어 옮긴 건 누름으로 안 침
  const TAP_SLOP_PX = 6; // 이보다 많이 움직이면 누름이 아니라 끌기
  const isOpen = () => location.hash === '#result' || location.hash === '#mess';
  let downAt = null;
  addEventListener('pointerdown', e => downAt = { x: e.clientX, y: e.clientY });
  addEventListener('click', e => {
    const moved = downAt && Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > TAP_SLOP_PX;
    if (moved || !isOpen() || !zoom.hidden) return;
    if (e.target.closest('.sheets, .paper, .zoom, .mark, .logo')) return;
    location.hash = '';
  });
  addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (!zoom.hidden) zoom.hidden = true;
    else if (isOpen()) location.hash = '';
  });

  // 복잡: 앞뒤 60장을 위에서 우수수 떨굼. 열 때마다 새로 흩어짐
  const mess = document.getElementById('mess');
  const DROP_STAGGER_MS = 20;
  const DROP_MS = 700;
  const MAX_TILT_DEG = 25;
  const papers = SCAN.flatMap(([w, h], i) => ['front', 'back'].map(side => {
    const img = new Image();
    img.className = 'paper';
    img.alt = '';
    img.draggable = false;
    img.width = w; img.height = h;
    img.style.setProperty('--w', w / SCAN_MAX_W);
    img.dataset.full = `pages/${side}/day${pad(i + 1)}.jpg`;
    img.dataset.small = `pages/small/${side}${pad(i + 1)}.jpg`;
    img.setAttribute('aria-label', `${i + 1}일차 ${side === 'front' ? '앞면' : '뒷면'}`);
    return img;
  }));
  const paperPos = new Map(); // img → { x, y, r }
  let paperTop = 0;
  const place = (img, p) => {
    paperPos.set(img, p);
    img.style.transform = `translate(${p.x}px, ${p.y}px) rotate(${p.r}deg)`;
  };
  const rand = (a, b) => a + Math.random() * (b - a);

  function dropPapers() {
    const shuffled = [...papers].sort(() => Math.random() - .5);
    const animate = !matchMedia('(prefers-reduced-motion: reduce)').matches;
    shuffled.forEach((img, k) => {
      if (!img.src) img.src = img.dataset.small;
      mess.append(img); // 순서대로 쌓임 (나중 것이 위)
      img.style.zIndex = paperTop = k;
      const pw = img.offsetWidth || 160; // 회전 영향 없는 너비
      const ph = pw * img.height / img.width;
      const end = { x: rand(-pw * .2, innerWidth - pw * .8), y: rand(-ph * .1, innerHeight - ph * .8), r: rand(-MAX_TILT_DEG, MAX_TILT_DEG) };
      place(img, end);
      if (animate) img.animate(
        [{ transform: `translate(${end.x}px, ${-ph - rand(0, 300)}px) rotate(${end.r + rand(-120, 120)}deg)` }, { transform: img.style.transform }],
        { duration: DROP_MS + rand(0, 300), delay: k * DROP_STAGGER_MS, easing: 'cubic-bezier(.25,.8,.35,1)', fill: 'backwards' }
      );
    });
  }
  const onHash = () => { if (location.hash === '#mess') dropPapers(); };
  addEventListener('hashchange', onHash);
  onHash();

  // 종이 집어서 옮기기. 안 움직이고 놓으면 크게 보기
  let held = null;
  mess.addEventListener('pointerdown', e => {
    const img = e.target.closest('.paper');
    if (!img) return;
    img.getAnimations().forEach(a => a.finish());
    img.setPointerCapture(e.pointerId);
    img.style.zIndex = ++paperTop;
    held = { img, startX: e.clientX, startY: e.clientY, from: paperPos.get(img), moved: false };
  });
  mess.addEventListener('pointermove', e => {
    if (!held) return;
    const dx = e.clientX - held.startX, dy = e.clientY - held.startY;
    if (!held.moved && Math.hypot(dx, dy) <= TAP_SLOP_PX) return;
    held.moved = true;
    held.img.classList.add('dragging');
    place(held.img, { ...held.from, x: held.from.x + dx, y: held.from.y + dy });
  });
  const dropHeld = e => {
    if (!held) return;
    const { img, moved } = held;
    held = null;
    img.classList.remove('dragging');
    if (!moved && e.type === 'pointerup') openZoom('single', img.dataset.full, null, `${img.getAttribute('aria-label')}, 누르면 작아짐`);
  };
  mess.addEventListener('pointerup', dropHeld);
  mess.addEventListener('pointercancel', dropHeld);

  // 띠 자동 흐름: 천천히 왼쪽으로. 마우스 올리면/만지면 멈춤. 30장 끝나면 복제본 덕에 1일차로 이어짐
  const FLOW_PX_PER_SEC = 30;
  const RESUME_AFTER_TOUCH_MS = 3000;
  const flowOn = !matchMedia('(prefers-reduced-motion: reduce)').matches;
  let flowPos = 0, flowPaused = false, flowLast = 0, resumeTimer;
  const loopWidth = () => sheets.children[DAYS].offsetLeft - sheets.children[0].offsetLeft;
  sheets.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') flowPaused = true; });
  sheets.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') flowPaused = false; });
  sheets.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse') return;
    flowPaused = true; clearTimeout(resumeTimer);
  });
  sheets.addEventListener('pointerup', e => {
    if (e.pointerType === 'mouse') return;
    resumeTimer = setTimeout(() => flowPaused = false, RESUME_AFTER_TOUCH_MS);
  });
  // 마우스로 띠 잡고 좌우로 밀기. 놓으면 민 속도로 미끄러지다 멈춤 (폰은 기본 스크롤로 밀림)
  const FLING_DECAY_PER_SEC = 0.05; // 1초 뒤 남는 속도 비율
  const FLING_MAX_PX_PER_SEC = 2500;
  const FLING_HOLD_MS = 100; // 놓기 전 이만큼 멈춰 있었으면 미끄러짐 없음
  let drag = null, fling = 0;
  sheets.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'mouse' || e.button !== 0) return;
    drag = { startX: e.clientX, lastX: e.clientX, lastT: e.timeStamp, v: 0 };
    fling = 0;
  });
  sheets.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.lastX, dt = Math.max(e.timeStamp - drag.lastT, 1) / 1000;
    if (!bandDragged && Math.abs(e.clientX - drag.startX) > TAP_SLOP_PX) {
      bandDragged = true;
      sheets.setPointerCapture(e.pointerId);
      sheets.classList.add('dragging');
    }
    if (!bandDragged) return;
    flowPos -= dx;
    sheets.scrollLeft = flowPos;
    drag = { ...drag, lastX: e.clientX, lastT: e.timeStamp, v: -dx / dt };
  });
  const endDrag = e => {
    if (!drag) return;
    const held = e.timeStamp - drag.lastT > FLING_HOLD_MS;
    if (bandDragged && !held) fling = Math.max(-FLING_MAX_PX_PER_SEC, Math.min(FLING_MAX_PX_PER_SEC, drag.v));
    drag = null;
    sheets.classList.remove('dragging');
  };
  sheets.addEventListener('pointerup', endDrag);
  sheets.addEventListener('pointercancel', endDrag);

  (function flow(t) {
    const dt = flowLast ? (t - flowLast) / 1000 : 0;
    flowLast = t;
    if (location.hash === '#result') {
      if (Math.abs(sheets.scrollLeft - flowPos) > 2) flowPos = sheets.scrollLeft; // 휠·손가락으로 넘긴 위치 따라감
      if (flowOn && !flowPaused && !drag && zoom.hidden) flowPos += FLOW_PX_PER_SEC * dt;
      if (fling) {
        flowPos += fling * dt;
        fling *= Math.pow(FLING_DECAY_PER_SEC, dt);
        if (Math.abs(fling) < 5) fling = 0;
      }
      const loop = loopWidth();
      if (flowPos >= loop) flowPos -= loop;
      if (flowPos < 0) flowPos += loop;
      sheets.scrollLeft = flowPos;
    }
    requestAnimationFrame(flow);
  })(0);

  // 배경 확대·축소: 휠/트랙패드 핀치, 폰 두 손가락, 드래그로 이동, 더블클릭으로 원래대로
  const page = document.querySelector('.page');
  const ZOOM_MIN = 0.3, ZOOM_MAX = 5;
  let view = { s: 1, x: 0, y: 0 };
  const pointers = new Map();
  let pinchStart = null;

  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const render = () => page.style.transform =
    `translate(calc(-50% + ${view.x}px), calc(-50% + ${view.y}px)) scale(${view.s})`;
  // (cx, cy) 화면 지점을 기준으로 배율 변경 → 커서 아래 지점이 그대로 머묾
  function zoomAt(s, cx, cy) {
    s = clamp(s, ZOOM_MIN, ZOOM_MAX);
    const ox = cx - innerWidth / 2 - view.x, oy = cy - innerHeight / 2 - view.y;
    const k = s / view.s;
    view = { s, x: view.x + ox * (1 - k), y: view.y + oy * (1 - k) };
    render();
  }

  addEventListener('wheel', e => {
    // 크게 보기·복잡 중엔 뒤 배경 안 움직임
    if (!zoom.hidden || location.hash === '#mess') { e.preventDefault(); return; }
    if (e.target.closest('.sheets')) { // 지면 띠 위에선 휠을 옆으로 넘기기로
      e.preventDefault();
      sheets.scrollLeft += Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      return;
    }
    e.preventDefault();
    zoomAt(view.s * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.002)), e.clientX, e.clientY);
  }, { passive: false });

  page.addEventListener('pointerdown', e => {
    if (e.target.closest('.mark')) return;
    page.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    page.classList.add('dragging');
  });
  page.addEventListener('pointermove', e => {
    const prev = pointers.get(e.pointerId);
    if (!prev) return;
    const cur = { x: e.clientX, y: e.clientY };
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()].map(p => p === prev ? cur : p);
      const dist = Math.hypot(a.x - b.x, a.y - b.y);
      if (!pinchStart) pinchStart = { dist, s: view.s };
      zoomAt(pinchStart.s * dist / pinchStart.dist, (a.x + b.x) / 2, (a.y + b.y) / 2);
    } else {
      view = { ...view, x: view.x + cur.x - prev.x, y: view.y + cur.y - prev.y };
      render();
    }
    pointers.set(e.pointerId, cur);
  });
  const release = e => {
    pointers.delete(e.pointerId);
    pinchStart = null;
    if (!pointers.size) page.classList.remove('dragging');
  };
  page.addEventListener('pointerup', release);
  page.addEventListener('pointercancel', release);
  page.addEventListener('dblclick', () => { view = { s: 1, x: 0, y: 0 }; render(); });

  const buddy = document.querySelector('.buddy');
  const EASE = matchMedia('(prefers-reduced-motion: reduce)').matches ? 1 : 0.12;
  const OFFSET = { x: 14, y: 20 }; // 커서 화살표 오른쪽 아래에 붙도록
  let target = null, pos = null;

  const IDLE_MS = 5000; // 이 시간 동안 안 움직이면 화남
  let idleTimer;

  addEventListener('pointermove', e => {
    target = { x: e.clientX, y: e.clientY };
    if (!pos) { pos = target; buddy.style.visibility = 'visible'; }
    buddy.classList.remove('angry');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => buddy.classList.add('angry'), IDLE_MS);
  });
  document.addEventListener('pointerleave', () => buddy.style.visibility = 'hidden');
  document.addEventListener('pointerenter', () => pos && (buddy.style.visibility = 'visible'));

  (function tick() {
    if (pos) {
      pos = { x: pos.x + (target.x - pos.x) * EASE, y: pos.y + (target.y - pos.y) * EASE };
      buddy.style.transform = `translate(${pos.x + OFFSET.x}px, ${pos.y + OFFSET.y}px)`;
    }
    requestAnimationFrame(tick);
  })();
</script>
</body>
</html>
