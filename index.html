<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>30 DAYS</title>
<style>
  html, body { margin: 0; background: #fff; }
  /* 배경: 원본 묶음(세로로 세운 누끼)을 화면 안에서 최대 크기로 */
  .page {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    touch-action: none; cursor: grab;
  }
  .page.dragging { cursor: grabbing; }
  .page > img { display: block; max-width: 92vw; max-height: 92vh; user-select: none; -webkit-user-drag: none; }

  /* 단어 링크: 로고처럼 마커로 그린 동그라미. 위치는 사진 기준 % */
  .mark { position: absolute; display: block; transform: rotate(12deg); /* 사진 속 글줄 기울기 */ }
  .mark svg { width: 100%; height: 100%; overflow: visible; }
  .mark path {
    fill: none; stroke: #000; stroke-width: 2.5;
    stroke-linecap: round; stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
    stroke-dasharray: 1; stroke-dashoffset: 0;
  }
  /* 올리면 동그라미를 다시 그림 */
  .mark:hover path, .mark:focus-visible path { animation: redraw .5s ease-out; }
  @keyframes redraw { from { stroke-dashoffset: 1; } }
  .mark:focus-visible { outline: none; }
  @media (prefers-reduced-motion: reduce) { .mark path { animation: none !important; } }
  /* 30일치 지면: 주소가 #result일 때 배경 위, 화면 가운데 1/3 띠에 한 줄로. 윗선 맞춤, 옆으로 넘겨 봄 */
  .sheets {
    /* 한 화면에 4장 반. 폰처럼 좁으면 최소 240px */
    --per-screen: 4.5;
    --sheet-w: max(calc((100vw - 24px) / var(--per-screen) - 24px), 240px);
    display: none; position: fixed; left: 0; right: 0; top: 33.333vh; z-index: 8;
    overflow-x: auto; overflow-y: hidden; overscroll-behavior: contain;
    padding: 0 24px; gap: 24px; align-items: flex-start;
    scrollbar-width: none;
  }
  .sheets::-webkit-scrollbar { display: none; }
  .sheets:target { display: flex; }
  .sheets:focus { outline: none; } /* #result 이동 때 생기는 포커스 테두리 */
  .sheet {
    position: relative; flex: none; padding: 0; border: 0; background: none; cursor: pointer;
    transform-style: preserve-3d; transition: transform .6s ease;
  }
  .sheet.flipped { transform: rotateY(180deg); }
  /* 너비 = 원본 스캔 너비 비율 × 기준 너비 → 종이 실제 크기 차이 유지 */
  .sheet img { display: block; width: calc(var(--w) * var(--sheet-w)); height: auto; backface-visibility: hidden; }
  .sheet .back { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; transform: rotateY(180deg); }
  @media (prefers-reduced-motion: reduce) { .sheet { transition: none; } }

  /* 크게 보기: 띠에서 누른 지면을 가운데 크게. 지면 누르면 뒷면, 바깥 누르면 닫힘 */
  .zoom {
    position: fixed; inset: 0; z-index: 9;
    display: grid; place-items: center;
    background: rgba(255, 255, 255, .9);
  }
  .zoom[hidden] { display: none; }
  .zoom .sheet img { width: auto; max-width: 90vw; max-height: 90vh; }
  .zoom .sheet .back { width: 100%; height: 100%; max-width: none; max-height: none; }
  .zoom .sheet:focus { outline: none; } /* 열 때 지면에 주는 포커스 테두리 숨김 (화면에 지면 하나뿐) */

  /* logo.png는 842×596 캔버스 가운데에 그림이 있어서, 그림 부분만 잘라 보여줌 */
  .logo {
    position: fixed; top: 24px; left: 24px;
    width: 128px; height: 136px; overflow: hidden;
    mix-blend-mode: multiply; z-index: 9; /* 흰 배경 PNG라 사진 위에서 흰 네모 안 보이게. 지면 목록 위에도 떠서 홈 버튼 역할 */
  }
  .logo img {
    width: 421px; /* 원본의 50% */
    margin: -72px 0 0 -138px;
  }

  /* 캐릭터: 마우스를 늦게 따라옴. 평소 c2(웃음), 5초간 안 움직이면 c1(화남) */
  .buddy {
    position: fixed; top: 0; left: 0; z-index: 10;
    width: 100px; height: 90px; overflow: hidden;
    pointer-events: none; mix-blend-mode: multiply; /* PNG가 흰 배경이라 겹칠 때 흰 박스 안 보이게 */
    visibility: hidden;
  }
  .buddy img { width: 337px; /* 원본의 40% */ display: none; }
  /* c1·c2는 캔버스 안 그림 위치가 달라서 각각 맞춤 */
  .buddy .c1 { margin: -82px 0 0 -134px; }
  .buddy .c2 { margin: -67px 0 0 -124px; }
  .buddy .c2, .buddy.angry .c1 { display: block; }
  .buddy.angry .c2 { display: none; }
  @media not (pointer: fine) { .buddy { display: none; } }
</style>
</head>
<body>
  <main class="page">
    <img src="main/main_02.png" alt="클립으로 묶은 원문 지면과 사견 묶음">
    <!-- ponytail: 링크 대상 미정이라 #앵커 -->
    <a class="mark" href="#result" aria-label="결과물 — 30일치 지면 보기" style="left:57.4%; top:32.3%; width:5.7%; height:4.2%"></a>
  </main>
  <!-- 결과물: 30일치 앞면. 누르면 뒷면. 뒤로가기·Esc·로고로 닫힘 -->
  <section id="result" class="sheets" aria-label="30일치 지면"></section>
  <div class="zoom" hidden role="dialog" aria-label="지면 크게 보기">
    <button class="sheet" type="button" aria-label="누르면 뒷면">
      <img class="front" alt=""><img class="back" alt="">
    </button>
  </div>
  <a class="logo" href="./"><img src="logo.png" alt="30 DAYS"></a>
  <div class="buddy" aria-hidden="true">
    <img class="c1" src="c1.png" alt="">
    <img class="c2" src="c2.png" alt="">
  </div>

<script>
  // 손그림 동그라미 (끝이 살짝 겹치게 한 붓질)
  const LOOP = '<svg viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="M10 24 C6 10 38 2 68 4 C90 6 99 18 90 29 C79 40 32 41 13 34 C2 29 5 14 24 8"/></svg>';
  document.querySelectorAll('.mark').forEach(a => a.insertAdjacentHTML('beforeend', LOOP));

  // 결과물: 앞면 30장 (pages/front·back/day01~30.jpg)
  // 원본 스캔 크기 [w, h] — 웹용은 줄여서 실제 크기 비율이 없어 여기서 씀
  const SCAN = [[1627,1548],[1639,1764],[1656,1924],[1650,1548],[1629,1228],[1691,1316],[1704,1796],[1653,1688],[1639,1556],[1623,1168],[1602,1152],[1653,1616],[1629,1404],[1616,1412],[1619,1124],[1616,1408],[1619,1332],[1616,1264],[1639,1496],[1639,1288],[1626,1140],[1632,1496],[1646,1388],[1619,940],[1639,980],[1605,1372],[1612,1636],[1616,1608],[1670,680],[1707,1072]];
  const DAYS = SCAN.length;
  const SCAN_MAX_W = Math.max(...SCAN.map(([w]) => w));
  const pad = n => String(n).padStart(2, '0');
  const sheets = document.getElementById('result');
  // 끊김 없이 돌도록 30장을 한 벌 더 붙임 (복제본은 스크린리더에서 숨김)
  sheets.innerHTML = [...SCAN, ...SCAN].map(([w, h], j) => {
    const i = j % DAYS, d = pad(i + 1), copy = j >= DAYS;
    return `<button class="sheet" type="button" aria-label="${i + 1}일차 지면 (누르면 뒷면)"${copy ? ' aria-hidden="true" tabindex="-1"' : ''}>
      <img src="pages/front/day${d}.jpg" alt="" loading="lazy" width="${w}" height="${h}" style="--w:${w / SCAN_MAX_W}">
      <img class="back" src="pages/back/day${d}.jpg" alt="" loading="lazy">
    </button>`;
  }).join('');
  // 띠에서 누르면 크게 보기
  const zoom = document.querySelector('.zoom');
  const zoomSheet = zoom.querySelector('.sheet');
  sheets.addEventListener('click', e => {
    const s = e.target.closest('.sheet');
    if (!s) return;
    const [front, back] = s.querySelectorAll('img');
    zoom.querySelector('.front').src = front.src;
    zoom.querySelector('.back').src = back.src;
    zoomSheet.classList.remove('flipped');
    zoomSheet.setAttribute('aria-label', `${s.getAttribute('aria-label').split(' ')[0]} 지면, 누르면 뒷면`);
    zoom.hidden = false;
    zoomSheet.focus();
  });
  zoom.addEventListener('click', e => {
    if (e.target.closest('.sheet')) zoomSheet.classList.toggle('flipped');
    else zoom.hidden = true;
  });
  addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (!zoom.hidden) zoom.hidden = true;
    else if (location.hash === '#result') location.hash = '';
  });

  // 띠 자동 흐름: 천천히 왼쪽으로. 마우스 올리면/만지면 멈춤. 30장 끝나면 복제본 덕에 1일차로 이어짐
  const FLOW_PX_PER_SEC = 30;
  const RESUME_AFTER_TOUCH_MS = 3000;
  const flowOn = !matchMedia('(prefers-reduced-motion: reduce)').matches;
  let flowPos = 0, flowPaused = false, flowLast = 0, resumeTimer;
  const loopWidth = () => sheets.children[DAYS].offsetLeft - sheets.children[0].offsetLeft;
  sheets.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') flowPaused = true; });
  sheets.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') flowPaused = false; });
  sheets.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse') return;
    flowPaused = true; clearTimeout(resumeTimer);
  });
  sheets.addEventListener('pointerup', e => {
    if (e.pointerType === 'mouse') return;
    resumeTimer = setTimeout(() => flowPaused = false, RESUME_AFTER_TOUCH_MS);
  });
  (function flow(t) {
    const dt = flowLast ? (t - flowLast) / 1000 : 0;
    flowLast = t;
    if (flowOn && location.hash === '#result') {
      if (Math.abs(sheets.scrollLeft - flowPos) > 2) flowPos = sheets.scrollLeft; // 손으로 넘긴 위치 따라감
      if (!flowPaused && zoom.hidden) flowPos += FLOW_PX_PER_SEC * dt;
      const loop = loopWidth();
      if (flowPos >= loop) flowPos -= loop;
      if (flowPos < 0) flowPos += loop;
      sheets.scrollLeft = flowPos;
    }
    requestAnimationFrame(flow);
  })(0);

  // 배경 확대·축소: 휠/트랙패드 핀치, 폰 두 손가락, 드래그로 이동, 더블클릭으로 원래대로
  const page = document.querySelector('.page');
  const ZOOM_MIN = 0.3, ZOOM_MAX = 5;
  let view = { s: 1, x: 0, y: 0 };
  const pointers = new Map();
  let pinchStart = null;

  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const render = () => page.style.transform =
    `translate(calc(-50% + ${view.x}px), calc(-50% + ${view.y}px)) scale(${view.s})`;
  // (cx, cy) 화면 지점을 기준으로 배율 변경 → 커서 아래 지점이 그대로 머묾
  function zoomAt(s, cx, cy) {
    s = clamp(s, ZOOM_MIN, ZOOM_MAX);
    const ox = cx - innerWidth / 2 - view.x, oy = cy - innerHeight / 2 - view.y;
    const k = s / view.s;
    view = { s, x: view.x + ox * (1 - k), y: view.y + oy * (1 - k) };
    render();
  }

  addEventListener('wheel', e => {
    if (!zoom.hidden) { e.preventDefault(); return; } // 크게 보기 중엔 뒤 배경 안 움직임
    if (e.target.closest('.sheets')) { // 지면 띠 위에선 휠을 옆으로 넘기기로
      e.preventDefault();
      sheets.scrollLeft += Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      return;
    }
    e.preventDefault();
    zoomAt(view.s * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.002)), e.clientX, e.clientY);
  }, { passive: false });

  page.addEventListener('pointerdown', e => {
    if (e.target.closest('.mark')) return;
    page.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    page.classList.add('dragging');
  });
  page.addEventListener('pointermove', e => {
    const prev = pointers.get(e.pointerId);
    if (!prev) return;
    const cur = { x: e.clientX, y: e.clientY };
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()].map(p => p === prev ? cur : p);
      const dist = Math.hypot(a.x - b.x, a.y - b.y);
      if (!pinchStart) pinchStart = { dist, s: view.s };
      zoomAt(pinchStart.s * dist / pinchStart.dist, (a.x + b.x) / 2, (a.y + b.y) / 2);
    } else {
      view = { ...view, x: view.x + cur.x - prev.x, y: view.y + cur.y - prev.y };
      render();
    }
    pointers.set(e.pointerId, cur);
  });
  const release = e => {
    pointers.delete(e.pointerId);
    pinchStart = null;
    if (!pointers.size) page.classList.remove('dragging');
  };
  page.addEventListener('pointerup', release);
  page.addEventListener('pointercancel', release);
  page.addEventListener('dblclick', () => { view = { s: 1, x: 0, y: 0 }; render(); });

  const buddy = document.querySelector('.buddy');
  const EASE = matchMedia('(prefers-reduced-motion: reduce)').matches ? 1 : 0.12;
  const OFFSET = { x: 14, y: 20 }; // 커서 화살표 오른쪽 아래에 붙도록
  let target = null, pos = null;

  const IDLE_MS = 5000; // 이 시간 동안 안 움직이면 화남
  let idleTimer;

  addEventListener('pointermove', e => {
    target = { x: e.clientX, y: e.clientY };
    if (!pos) { pos = target; buddy.style.visibility = 'visible'; }
    buddy.classList.remove('angry');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => buddy.classList.add('angry'), IDLE_MS);
  });
  document.addEventListener('pointerleave', () => buddy.style.visibility = 'hidden');
  document.addEventListener('pointerenter', () => pos && (buddy.style.visibility = 'visible'));

  (function tick() {
    if (pos) {
      pos = { x: pos.x + (target.x - pos.x) * EASE, y: pos.y + (target.y - pos.y) * EASE };
      buddy.style.transform = `translate(${pos.x + OFFSET.x}px, ${pos.y + OFFSET.y}px)`;
    }
    requestAnimationFrame(tick);
  })();
</script>
</body>
</html>
